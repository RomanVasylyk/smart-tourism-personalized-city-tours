cities:
  - slug: nitra
    name: Nitra
    country: Slovakia
    center:
      lat: 48.3076
      lon: 18.0845
    bbox:
      south: 48.28
      west: 18.03
      north: 48.36
      east: 18.13
    available_categories:
      - attraction
      - museum
      - gallery
      - viewpoint
      - monument
      - historical_site
      - park
      - religious_site
    default_score_adjustments:
      historical_site: 0.05
      museum: 0.05
    default_zoom: 13.0
    routing_limits:
      max_available_minutes: 360
      max_poi_candidates: 300
    transport:
      mhd_enabled: true
      provider: transdev_nitra
      mode: static
      datasource: provider_pdf
      source_index_url: https://nitra.transdev.sk/cp/
      raw_data_subdir: transport/nitra/raw
      processed_graph_path: transport/nitra/processed/transport_graph.json
      stop_source: osm_overpass
      stop_query_areas:
        - name: urban_core
          south: 48.28
          west: 18.03
          north: 48.36
          east: 18.13
        - name: south_southeast_corridor
          south: 48.19
          west: 18.07
          north: 48.31
          east: 18.18
        - name: east_periphery
          south: 48.30
          west: 18.10
          north: 48.36
          east: 18.17
      average_wait_minutes: 4
      transit_speed_kmh: 24
      min_direct_distance_meters: 1200
      max_first_mile_meters: 650
      max_last_mile_meters: 650
      max_total_duration_multiplier: 1.15
      min_walking_distance_savings_meters: 450
    city_specific_exclusions:
      excluded_name_patterns: []
