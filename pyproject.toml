[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = '''
/(
  android-app
  | pipeline/data
)/
'''

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
  "android-app",
  "pipeline/data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
