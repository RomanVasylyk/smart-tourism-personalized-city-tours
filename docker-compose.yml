services:
  db:
    image: ${POSTGIS_IMAGE:?Set POSTGIS_IMAGE in .env}
    container_name: smart-tourism-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${POSTGRES_USER}\" -d \"${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: smart-tourism-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      ROUTING_ENABLED: ${ROUTING_ENABLED:?Set ROUTING_ENABLED in .env}
      ROUTING_BASE_URL: ${ROUTING_BASE_URL:?Set ROUTING_BASE_URL in .env}
      ROUTING_PROFILE: ${ROUTING_PROFILE:?Set ROUTING_PROFILE in .env}
      ROUTING_TIMEOUT_SECONDS: ${ROUTING_TIMEOUT_SECONDS:?Set ROUTING_TIMEOUT_SECONDS in .env}
    ports:
      - "${BACKEND_PORT:?Set BACKEND_PORT in .env}:8000"
    depends_on:
      db:
        condition: service_healthy
      routing:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  routing:
    image: ${OSRM_IMAGE:?Set OSRM_IMAGE in .env}
    container_name: smart-tourism-routing
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/${OSRM_DATA_FILE:?Set OSRM_DATA_FILE in .env}
    environment:
      OSRM_DATA_FILE: ${OSRM_DATA_FILE:?Set OSRM_DATA_FILE in .env}
    ports:
      - "${ROUTING_PORT:?Set ROUTING_PORT in .env}:5000"
    volumes:
      - ./routing-data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "test -s /data/${OSRM_DATA_FILE}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
