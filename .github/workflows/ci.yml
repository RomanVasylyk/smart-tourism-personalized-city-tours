name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r pipeline/requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check backend pipeline

      - name: Black
        run: black --check backend pipeline

      - name: Pytest
        run: python -m pytest backend/tests pipeline/tests

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android-app
        run: ./gradlew testDebugUnitTest -PsmartTourismDebugApiTarget=phone
